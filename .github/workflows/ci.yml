name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-policies:
    name: Node 22 browser policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Install PHP fixture bridge
        run: composer install --prefer-dist --no-interaction
      - name: Run deterministic browser and webhook policies
        run: node --test --test-concurrency=1 tools/browser/*.test.cjs tools/webhooks/*.test.cjs
  checks:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: [lowest, latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Validate package metadata
        run: composer validate --strict
      - name: Resolve lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-dist --no-interaction
      - name: Resolve latest dependencies
        if: matrix.dependencies == 'latest'
        run: composer update --prefer-dist --no-interaction
      - name: Verify resolved platform requirements
        run: composer check-platform-reqs
      - name: Run deterministic tests, style and static analysis
        env:
          COMPOSER_PROCESS_TIMEOUT: '1800'
        run: composer check
      - name: Install clean consumer with lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer check:consumer -- --lowest
      - name: Install clean consumer with latest dependencies
        if: matrix.dependencies == 'latest'
        run: composer check:consumer
      - name: Inspect archive and install clean artifact consumer with lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer check:artifact -- --lowest
      - name: Inspect archive and install clean artifact consumer with latest dependencies
        if: matrix.dependencies == 'latest'
        run: composer check:artifact
