name: Publish to Packagist

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: packagist-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Refresh Packagist package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request package update
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [[ -z "$PACKAGIST_USERNAME" || -z "$PACKAGIST_API_TOKEN" ]]; then
            echo '::error::Set the PACKAGIST_USERNAME and PACKAGIST_API_TOKEN repository secrets.'
            exit 1
          fi

          payload="$(jq -cn --arg repository "$REPOSITORY_URL" '{repository: $repository}')"
          response="$(curl --fail --silent --show-error \
            --proto '=https' \
            --connect-timeout 10 \
            --max-time 60 \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $PACKAGIST_USERNAME:$PACKAGIST_API_TOKEN" \
            --data "$payload" \
            https://packagist.org/api/update-package)"

          if ! jq -e '.status == "success"' <<< "$response" > /dev/null; then
            echo '::error::Packagist did not accept the package update.'
            exit 1
          fi

          echo 'Packagist accepted the repository refresh. Version indexing runs asynchronously.' >> "$GITHUB_STEP_SUMMARY"
